# TEAR-IX GRUB Bootloader Configuration
# Used for both x86_64 UEFI and RISC-V ports

# Default boot entry: TEAR-IX Live
set default="0"
set timeout="10"
set title="TEAR-IX.00.00 ; by tear-it co"

# Color palette: #FFCC00, #DC143C, #D2B48C, #9370DB
# Gold, Crimson, Tan, Purple

# Load modules
insmod part_gpt
insmod ext2
insmod part_msdos
insmod lvm
insmod iso9660
insmod loopback
insmod gfxterm
insmod png
insmod jpeg

# Set gfx mode
set gfxmode=auto
terminal gfxterm

# Load theme
if [ -f /boot/grub/theme.txt ]; then
    load_env -f /boot/grub/theme.txt
fi

# Boot entry: TEAR-IX Live (x86_64)
menuentry "TEAR-IX Live (tear-ix ; by tear-it co)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live init=/sbin/init \
        console=ttyS0,115200n8 console=tty0 \
        quiet splash
    initrd /live/initrd.img
}

# Boot entry: TEAR-IX Live (Safe Mode)
menuentry "TEAR-IX Live (Safe Mode)" {
    linux /live/vmlinuz boot=live init=/sbin/init \
        console=ttyS0,115200n8 console=tty0 \
        nomodeset noapic acpi=off
    initrd /live/initrd.img
}

# Boot entry: TEAR-IX Installer
menuentry "Install TEAR-IX to disk" {
    linux /live/vmlinuz boot=live components \
        initrd=/live/initrd.img \
        -- quiet
    initrd /live/initrd.img
}

# Boot entry: Run on rvemu (RISC-V)
menuentry "TEAR-IX RISC-V (rvemu stubs)" {
    linux /live/vmlinuz.boot_riscv \
        console=ttyS0,115200n8 root=/dev/vda rw \
        init=/sbin/tear-ix-init
    initrd /live/initrd_riscv.img
}

# Reboot / Halt
menuentry "Reboot" {
    reboot
}
menuentry "Halt" {
    halt
}
